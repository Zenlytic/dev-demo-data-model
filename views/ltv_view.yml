version: 1
type: view
name: ltv
label: Customer LTV
description: >-
  Customer lifetime value data at a customer-month grain. Each row represents
  one customer's activity in a given month, including orders placed, cumulative
  order history, and gross sales. Use this table to analyze cohort LTV trends
  and customer purchasing behavior over time.
model_name: pure_organics
sql_table_name: DEMO.DEMO_PROD.LTV
default_date: activity_time
fields:
- name: customer_id
  field_type: dimension
  type: number
  primary_key: true
  label: Customer ID
  description: Unique identifier for the customer.
  sql: ${TABLE}.CUSTOMER_ID
  searchable: false

- name: date_month_week
  field_type: dimension
  type: string
  hidden: false
  label: Date Month Week
  description: The week of the customer activity month.
  sql: TO_CHAR(DATE_TRUNC('week', ${TABLE}.DATE_MONTH), 'YYYY-MM-DD')
  searchable: false

- name: date_month_month
  field_type: dimension
  type: string
  hidden: false
  label: Date Month Month
  description: The month of the customer activity.
  sql: TO_CHAR(DATE_TRUNC('month', ${TABLE}.DATE_MONTH), 'YYYY-MM')
  searchable: false

- name: date_month_quarter
  field_type: dimension
  type: string
  hidden: false
  label: Date Month Quarter
  description: The quarter of the customer activity.
  sql: TO_CHAR(DATE_TRUNC('quarter', ${TABLE}.DATE_MONTH), 'YYYY-MM')
  searchable: false

- name: date_month_year
  field_type: dimension
  type: number
  hidden: false
  label: Date Month Year
  description: The year of the customer activity.
  sql: YEAR(${TABLE}.DATE_MONTH)
  searchable: false

- name: n_customers_in_month
  field_type: dimension
  type: number
  label: Active in Month
  description: >-
    1 if the customer was active (placed at least one order) in this month,
    0 otherwise.
  sql: ${TABLE}.N_CUSTOMERS_IN_MONTH
  searchable: false

- name: n_orders_in_month
  field_type: dimension
  type: number
  label: Orders in Month
  description: Number of orders placed by this customer in this month.
  sql: ${TABLE}.N_ORDERS_IN_MONTH
  searchable: false

- name: n_cumulative_orders
  field_type: dimension
  type: number
  label: Cumulative Orders
  description: Running total of orders placed by this customer up to and including
    this month.
  sql: ${TABLE}.N_CUMULATIVE_ORDERS
  searchable: false

- name: gross_sales
  field_type: dimension
  type: number
  label: Gross Sales
  description: Gross sales revenue attributed to this customer in this month.
  sql: ${TABLE}.GROSS_SALES
  searchable: false

- name: activity_time
  field_type: dimension_group
  type: time
  datatype: date
  label: Date Month
  description: The calendar month for this row of customer activity.

  timeframes:
  - raw
  - date
  sql: ${TABLE}.DATE_MONTH
- name: total_gross_sales
  field_type: measure
  type: sum
  label: Total Gross Sales
  description: Sum of gross sales across all customers and months.
  value_format_name: usd

  sql: ${TABLE}.GROSS_SALES
- name: total_orders
  field_type: measure
  type: sum
  label: Total Orders
  description: Total number of orders placed across all customers and months.

  sql: ${TABLE}.N_ORDERS_IN_MONTH
- name: total_active_customers
  field_type: measure
  type: sum
  label: Total Active Customers
  description: Total count of active customer-months (customers active in a given
    month).

  sql: ${TABLE}.N_CUSTOMERS_IN_MONTH
- name: avg_cumulative_orders
  field_type: measure
  type: average
  label: Avg Cumulative Orders
  description: Average number of cumulative orders per customer-month row.
  value_format_name: decimal_2
  sql: ${TABLE}.N_CUMULATIVE_ORDERS
